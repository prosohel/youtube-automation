# docker compose up -d --build     -> dashboard on http://localhost:7000 (this PC only)
# Every service restarts by itself, so everything comes back when Docker Desktop starts with Windows.
name: automation-studio

x-env: &env
  REDIS_URL: redis://redis:6379
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:7000}
  TZ: Asia/Dhaka

services:
  redis:
    image: redis:7-alpine
    # Append-only file: the queue, settings and history survive shutdowns.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  web:
    build: .
    image: automation-studio:latest
    command: ["node", "server/api.js"]
    ports:
      - "127.0.0.1:7000:7000"
    environment:
      <<: *env
      PORT: 7000
      # One shared password for the dashboard (8+ characters). Required when PUBLIC_URL is not localhost.
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      HOST: 0.0.0.0 # inside the container only; the port mapping above keeps the dashboard on this PC
      IMPORT_DIR: /app/import
    volumes:
      - ./output:/app/output
      - ./footage:/app/footage
      # The project folder, read-only: .env, client_secret.json and token.json are read once on first start
      # (missing files are simply skipped; single-file mounts would create empty folders on the PC instead).
      - ./:/app/import:ro
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    image: automation-studio:latest
    command: ["node", "server/worker.js"]
    environment: *env
    volumes:
      - ./output:/app/output
      - ./footage:/app/footage
      - ./music:/app/music
      - ./assets:/app/assets
    shm_size: "1gb" # headless Chrome (Remotion) needs more than Docker's 64 MB default
    init: true # reaps Chrome/ffmpeg child processes
    depends_on:
      - redis
      - web
    restart: unless-stopped

volumes:
  redis-data:
