version: 2

# Kept quiet on purpose: one grouped PR per ecosystem per month for
# minor/patch bumps. Major versions are ignored here and upgraded by hand
# (they need a real check, e.g. node-html-parser, katex, Node itself).
# Security updates still arrive on their own, whatever this file says.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # All Remotion packages must stay on the same version.
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Stay on Node LTS; bump the major by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
