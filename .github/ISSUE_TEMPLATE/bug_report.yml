name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Remove every key, token and channel ID from logs before you paste them.**
        For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start with `docker compose up -d`
        2. On the Queue page, press ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How do you run it
      options:
        - Automation Studio (docker compose)
        - Dashboard and worker without Docker
        - Command-line tool (npm start)
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where it fails
      multiple: true
      options:
        - Topic or script (Claude)
        - Voice
        - Render (Remotion or FFmpeg)
        - Publish to YouTube
        - Publish to TikTok
        - Publish to Instagram or Facebook
        - Schedules
        - Dashboard
        - Setup or install
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `docker compose logs --tail=200 worker` (or the terminal output), with secrets removed.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      description: Operating system, Node version (`node -v`), Docker version, and the commit or release you run.
      placeholder: Windows 11, Node 22.11, Docker Desktop 4.36, commit 2a02037
    validations:
      required: true
