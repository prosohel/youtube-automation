# Production on a VM (4 vCPU / 12 GB): HTTPS via Caddy, the dashboard not exposed directly, limits so a render
# can never take the machine down, logs rotated. Secrets stay in .env on the server.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Needs in .env: DOMAIN, PUBLIC_URL=https://<DOMAIN>, DASHBOARD_PASSWORD, TRUST_PROXY=1 (see docs/deploy.md).
name: automation-studio

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped
    <<: *logging

  redis:
    <<: *logging
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    # Only Caddy reaches the dashboard; nothing listens on the VM's public interface but 80/443.
    ports: !override []
    expose:
      - "7000"
    environment:
      TRUST_PROXY: "1"
      REMOTION_GL: ${REMOTION_GL:-swangle}
    deploy:
      resources:
        limits:
          memory: 1G
    <<: *logging

  worker:
    environment:
      REMOTION_GL: ${REMOTION_GL:-swangle}
      # Keeps one render's Chrome inside this many threads so the dashboard stays responsive.
      REMOTION_CONCURRENCY: ${REMOTION_CONCURRENCY:-3}
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 8G
    <<: *logging

volumes:
  caddy-data:
  caddy-config:
